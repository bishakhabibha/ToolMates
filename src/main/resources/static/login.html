<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - ToolMates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; background-color: #e9eeed; }
        .card { background: #ffffff; border-radius: 20px; width: 100%; max-width: 460px; border: 1px solid #dde6e5; box-shadow: 0 4px 24px rgba(0,40,36,0.10); overflow: hidden; }
        .accent-bar { height: 4px; background-color: #00564b; }
        .inner { padding: 42px 46px; }
        .brand { display: flex; align-items: center; gap: 13px; justify-content: center; margin-bottom: 6px; }
        .logo { width: 48px; height: 48px; border-radius: 13px; background-color: #d3e6e3; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .logo svg { width: 25px; height: 25px; fill: #00564b; }
        .brand-name { font-size: 24px; font-weight: 700; color: #00564b; letter-spacing: -0.3px; }
        .brand-sub { text-align: center; font-size: 11.5px; color: #6b7d7b; margin-bottom: 35px; margin-top: 4px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 500; }
        .brand-sub span { color: #00564b; margin: 0 6px; font-size: 10px; vertical-align: middle; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .lbl { font-size: 12px; font-weight: 600; color: #3e4f4d; letter-spacing: 0.2px; display: flex; align-items: center; gap: 6px; }
        .lbl i { font-size: 14px; color: #00564b; }
        .req { color: #00564b; margin-left: 2px; }
        .input-wrap { position: relative; }
        .input-wrap input { padding-right: 40px; }
        .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3a1; font-size: 16px; padding: 0; line-height: 1; transition: color .2s; }
        .eye-btn:hover { color: #00564b; }
        input[type=text], input[type=password] { width: 100%; background-color: #eef2f1; border: 1.5px solid #d6e0de; border-radius: 10px; color: #1e2a28; font-family: 'Segoe UI', sans-serif; font-size: 13.5px; padding: 11px 14px; outline: none; transition: border-color .2s, box-shadow .2s, background .2s; }
        input[type=text]:focus, input[type=password]:focus { border-color: #00564b; box-shadow: 0 0 0 3px rgba(0,86,75,0.12); background-color: #ffffff; }
        input::placeholder { color: #94a3a1; }
        .err { font-size: 11px; color: #b3261e; margin-top: 3px; display: none; }
        .err.visible { display: block; }
        .options-row { display: flex; justify-content: flex-start; align-items: center; margin-top: 4px; margin-bottom: 24px; }
        .remember-me { display: flex; gap: 8px; align-items: center; cursor: pointer; }
        .remember-me input[type=checkbox] { width: 15px; height: 15px; accent-color: #00564b; cursor: pointer; }
        .remember-me span { font-size: 12.5px; color: #5a6e6c; user-select: none; }
        .btn-submit { width: 100%; padding: 13px; background-color: #00564b; border: 1px solid transparent; border-radius: 10px; color: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer; letter-spacing: 0.3px; transition: background-color .2s, transform .15s; }
        .btn-submit:hover { background-color: #003c34; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .register-redirect { text-align: center; font-size: 12.5px; color: #6b7d7b; margin-top: 24px; }
        .register-redirect a { color: #00564b; text-decoration: none; font-weight: 600; }
        .register-redirect a:hover { color: #003c34; }
    </style>
</head>
<body>
<div class="card">
    <div class="accent-bar"></div>
    <div class="inner">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                </svg>
            </div>
            <span class="brand-name">ToolMates</span>
        </div>
        <div class="brand-sub">Connect <span>&#9670;</span> Share <span>&#9670;</span> Create</div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label class="lbl"><i class="ti ti-id-badge"></i>Student ID <span class="req">*</span></label>
                <input type="text" id="username" />
                <span class="err" id="err-username">Please enter your Student ID.</span>
            </div>

            <div class="field">
                <label class="lbl"><i class="ti ti-lock"></i>Password <span class="req">*</span></label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter your password" />
                    <button type="button" class="eye-btn" onclick="togglePassword('password', this)" aria-label="Show password">
                        <i class="ti ti-eye"></i>
                    </button>
                </div>
                <span class="err" id="err-password">Password is required.</span>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" />
                    <span>Remember me for 30 days</span>
                </label>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Log In &rarr;</button>
        </form>

        <div class="register-redirect">New to ToolMates? <a href="/signup">Create an account</a></div>
    </div>
</div>

<script>
    (() => {
        const apiOrigin = (location.port === '63342' || location.protocol === 'file:') ? 'http://localhost:8080' : '';
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/api/')) {
                return originalFetch(apiOrigin + input, init);
            }
            return originalFetch(input, init);
        };
    })();

    const API = '/api/auth';

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'ti ti-eye-off';
        } else {
            input.type = 'password';
            icon.className = 'ti ti-eye';
        }
    }

    function showErr(id, show, msg) {
        const el = document.getElementById(id);
        if (msg) el.textContent = msg;
        el.classList.toggle('visible', show);
    }

    function setBtn(id, loading) {
        const btn = document.getElementById(id);
        btn.disabled = loading;
        if (loading) btn.dataset.orig = btn.textContent;
        btn.textContent = loading ? 'Please wait...' : btn.dataset.orig;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const usernameVal = document.getElementById('username').value.trim();
        const passwordVal = document.getElementById('password').value;
        let valid = true;

        if (!usernameVal) { showErr('err-username', true);  valid = false; }
        else               showErr('err-username', false);

        if (!passwordVal) { showErr('err-password', true);  valid = false; }
        else               showErr('err-password', false);

        if (!valid) return;
        setBtn('loginBtn', true);
        try {
            const r = await fetch(API + '/login', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username:   usernameVal,
                    password:   passwordVal,
                    rememberMe: document.getElementById('rememberMe').checked
                })
            });
            const data = await r.json();
            if (r.ok) {
                localStorage.setItem('toolmatesUser', JSON.stringify({
                    userId: data.userId,
                    studentId: data.studentId,
                    firstName: data.firstName,
                    lastName: data.lastName
                }));
                window.location.href = '/dashboard';
            } else {
                alert(data.error || 'Invalid credentials. Please try again.');
            }
        } catch {
            alert('Could not connect to authentication server. Make sure your backend is running.');
        } finally {
            setBtn('loginBtn', false);
        }
    });
</script>
</body>
</html>
