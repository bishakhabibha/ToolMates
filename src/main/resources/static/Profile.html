<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - ToolMates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffffff; color: #2c3e50; min-height: 100vh; }
        .navbar { background-color: #ffffff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eef2f5; height: 70px; }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { background: #f4f7f6; border: 1px solid #e0eae9; color: #00796b; font-size: 20px; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .brand-name { font-size: 22px; font-weight: 700; color: #00796b; letter-spacing: -0.5px; }
        .content-area { background-color: #f4f7f6; padding: 30px; min-height: calc(100vh - 70px); }
        .profile-shell { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #ffffff; border-radius: 16px; border: 1px solid #eef2f5; padding: 24px; box-shadow: 0 4px 20px rgba(0,77,64,0.03); }
        .profile-head { display: flex; align-items: center; gap: 18px; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; background: #00796b; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; object-fit: cover; }
        .profile-main { flex: 1; min-width: 0; }
        .profile-name-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .profile-name { font-size: 24px; font-weight: 700; color: #1a2e2b; }
        .profile-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin-top: 10px; }
        .profile-detail span { display: block; font-size: 11px; color: #78909c; font-weight: 700; text-transform: uppercase; }
        .profile-detail strong { display: block; margin-top: 1px; font-size: 13px; color: #2c3e50; font-weight: 600; word-break: break-word; }
        .profile-bio { color: #546e7a; margin-top: 4px; }
        .profile-actions { display: none; margin-left: auto; flex-shrink: 0; }
        .bio-editor { display: none; margin-top: 12px; }
        .bio-editor textarea { width: 100%; min-height: 90px; resize: vertical; padding: 10px 14px; border-radius: 8px; border: 1px solid #ced6d6; font-family: inherit; color: #2c3e50; outline: none; }
        .bio-editor-actions { display: flex; gap: 8px; margin-top: 8px; }
        button.secondary { background: #ffffff; color: #00796b; border: 1px solid #00796b; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .stat { background: #f4fbfa; border: 1px solid #b2dfdb; border-radius: 10px; padding: 14px; }
        .stat span { display: block; font-size: 12px; color: #546e7a; font-weight: 700; text-transform: uppercase; }
        .stat strong { font-size: 20px; color: #00564b; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .tool-card { background: #ffffff; border: 1px solid #eef2f5; border-radius: 16px; padding: 16px; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
        .tool-card:hover { border-color: #00796b; transform: translateY(-1px); }
        .tool-card img { width: 100%; height: 120px; border-radius: 12px; object-fit: cover; background: #d4edea; margin-bottom: 10px; }
        .tool-card h3 { font-size: 15px; color: #1a2e2b; margin-bottom: 4px; }
        .tool-card p { font-size: 13px; color: #7f8c8d; margin-bottom: 2px; }
        input { padding: 10px 14px; border-radius: 8px; border: 1px solid #ced6d6; outline: none; }
        button { padding: 10px 16px; border-radius: 8px; border: none; background: #00796b; color: #ffffff; font-weight: 700; cursor: pointer; }
        @media (max-width: 700px) { .stats-grid { grid-template-columns: 1fr; } .profile-head { align-items: flex-start; } .profile-details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header class="navbar">
    <div class="nav-left">
        <a href="dashboard.html" class="menu-btn"><i class="ti ti-arrow-left"></i></a>
        <span class="brand-name">ToolMates</span>
    </div>
</header>
<main class="content-area">
    <div class="profile-shell">
        <section class="panel">
            <input id="studentIdInput" aria-label="Student ID" />
            <button onclick="loadProfile()">Load Profile</button>
        </section>
        <section class="panel profile-head">
            <div class="avatar" id="profileAvatar">?</div>
            <div class="profile-main">
                <div class="profile-name-row">
                    <div class="profile-name" id="profileName">Profile</div>
                    <div class="profile-actions" id="profileActions">
                        <button onclick="showBioEditor()">Edit Profile</button>
                    </div>
                </div>
                <div class="profile-details">
                    <div class="profile-detail"><span>Department</span><strong id="profileDepartment">-</strong></div>
                    <div class="profile-detail"><span>Student ID</span><strong id="profileStudentId">-</strong></div>
                    <div class="profile-detail"><span>Phone</span><strong id="profilePhone">-</strong></div>
                    <div class="profile-detail"><span>Student Email</span><strong id="profileStudentEmail">-</strong></div>
                </div>
                <div class="profile-bio" id="profileBio">Load a profile to view user details.</div>
                <div class="bio-editor" id="bioEditor">
                    <textarea id="bioInput" maxlength="500" placeholder="Write a short bio..."></textarea>
                    <div class="bio-editor-actions">
                        <button onclick="saveBio()">Save</button>
                        <button class="secondary" onclick="hideBioEditor()">Cancel</button>
                    </div>
                </div>
            </div>
        </section>
        <section class="stats-grid">
            <div class="stat"><span>Average Rating</span><strong id="averageRating">0</strong></div>
            <div class="stat"><span>Total Reports Received</span><strong id="totalReportsReceived">0</strong></div>
            <div class="stat"><span>Tools Listed</span><strong id="listedToolCount">0</strong></div>
            <div class="stat"><span>Tools Successfully Rented</span><strong id="toolsSuccessfullyRented">0</strong></div>
            <div class="stat"><span>Tools Successfully Borrowed</span><strong id="toolsSuccessfullyBorrowed">0</strong></div>
        </section>
        <section class="panel">
            <h2>Listed Tools</h2>
            <div class="tools-grid" id="profileTools"></div>
        </section>
    </div>
</main>
    <script>
    (() => {
        const apiOrigin = (location.port === '63342' || location.protocol === 'file:') ? 'http://localhost:8080' : '';
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/api/')) {
                return originalFetch(apiOrigin + input, init);
            }
            return originalFetch(input, init);
        };
    })();
    </script><script>
    let currentProfile = null;
    let viewingOwnProfile = false;

    async function loadProfile(studentIdOverride) {
        const studentId = studentIdOverride || document.getElementById('studentIdInput').value.trim();
        const url = studentId
                ? `/api/profile/${encodeURIComponent(studentId)}`
                : '/api/profile/me';
        const response = await fetch(url, {
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) {
            alert('Profile not found or you are not logged in.');
            return;
        }
        const profile = await response.json();
        currentProfile = profile;
        await updateOwnProfileState(studentId);
        document.getElementById('profileName').textContent = profile.name || 'Profile';
        document.getElementById('profileDepartment').textContent = profile.department || '-';
        document.getElementById('profileStudentId').textContent = profile.studentId || '-';
        document.getElementById('profilePhone').textContent = profile.phone || '-';
        document.getElementById('profileStudentEmail').textContent = profile.studentEmail || '-';
        document.getElementById('profileBio').textContent = profile.bio || 'No bio added yet.';
        document.getElementById('averageRating').textContent = profile.averageRating || 0;
        document.getElementById('totalReportsReceived').textContent = profile.totalReportsReceived ?? 0;
        document.getElementById('toolsSuccessfullyRented').textContent = profile.toolsSuccessfullyRented ?? 0;
        document.getElementById('toolsSuccessfullyBorrowed').textContent = profile.toolsSuccessfullyBorrowed ?? 0;
        const tools = profile.listedTools || [];
        document.getElementById('listedToolCount').textContent = profile.toolsListed ?? tools.length;
        document.getElementById('profileActions').style.display = viewingOwnProfile ? 'flex' : 'none';
        hideBioEditor();

        const avatar = document.getElementById('profileAvatar');
        if (profile.avatarUrl) {
            avatar.outerHTML = `<img class="avatar" id="profileAvatar" src="${profile.avatarUrl}" alt="${profile.name || 'Avatar'}" />`;
        } else {
            avatar.textContent = (profile.name || '?').split(' ').map(part => part[0]).join('').slice(0, 2).toUpperCase();
        }

        const grid = document.getElementById('profileTools');
        grid.innerHTML = tools.length ? '' : '<p>No listed tools yet.</p>';
        tools.forEach(tool => {
            const image = tool.imageUrls && tool.imageUrls.length ? tool.imageUrls[0] : 'https://images.unsplash.com/photo-1504148455328-c376907d081c?w=400&auto=format&fit=crop&q=80';
            grid.innerHTML += `
                <div class="tool-card" onclick="window.location.href='ToolInfo.html?id=${tool.id}'">
                    <img src="${image}" alt="${tool.name || 'Tool'}" />
                    <h3>${tool.name || 'Unnamed Tool'}</h3>
                    <p>${tool.category || 'General'} - Tk ${tool.pricePerDay || 0}/day</p>
                    <p>Rating: ${tool.rating || 0}</p>
                    <p>Successful rentals: ${tool.successfulRentalCount || 0}</p>
                </div>`;
        });
    }

    async function updateOwnProfileState(studentId) {
        try {
            const response = await fetch('/api/auth/me', { credentials: 'include', headers: { 'Accept': 'application/json' } });
            if (!response.ok) {
                viewingOwnProfile = false;
                return;
            }
            const me = await response.json();
            viewingOwnProfile = !studentId || me.studentId === studentId;
        } catch (error) {
            viewingOwnProfile = false;
        }
    }

    function showBioEditor() {
        document.getElementById('bioInput').value = currentProfile && currentProfile.bio ? currentProfile.bio : '';
        document.getElementById('bioEditor').style.display = 'block';
    }

    function hideBioEditor() {
        document.getElementById('bioEditor').style.display = 'none';
    }

    async function saveBio() {
        const bio = document.getElementById('bioInput').value.trim();
        const response = await fetch('/api/profile/me/bio', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ bio })
        });
        if (!response.ok) {
            alert('Could not save bio.');
            return;
        }
        const profile = await response.json();
        currentProfile = profile;
        document.getElementById('profileBio').textContent = profile.bio || 'No bio added yet.';
        hideBioEditor();
    }

    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('studentId');
        if (studentId) {
            document.getElementById('studentIdInput').value = studentId;
            loadProfile(studentId);
        } else {
            loadProfile('');
        }
    });
</script>
</body>
</html>
