<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List a Tool — ToolMates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Top Navigation Bar --- */
        .navbar {
            background-color: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eef2f5;
            height: 70px;
        }

        .nav-left { display: flex; align-items: center; gap: 16px; }

        .menu-btn {
            background: #f4f7f6;
            border: 1px solid #e0eae9;
            color: #00796b;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .brand-name { font-size: 22px; font-weight: 700; color: #00796b; letter-spacing: -0.5px; }

        .nav-right { display: flex; gap: 12px; }

        .btn-nav {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-login { color: #00796b; border: 1px solid #00796b; background: transparent; }
        .btn-login:hover { background: rgba(0, 121, 107, 0.05); }

        /* --- Main Layout Wrapper --- */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* --- Sidebar Panel --- */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid #eef2f5;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7f8c8d;
            margin: 20px 0 10px 12px;
        }
        .sidebar-section-title:first-of-type { margin-top: 0; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            color: #546e7a;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .menu-item:hover {
            color: #00796b;
            background-color: #e0f2f1;
        }
        .menu-item i { font-size: 18px; }

        /* --- Content Container --- */
        .content-area {
            flex: 1;
            background-color: #f4f7f6;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,77,64,0.03);
            border: 1px solid #eef2f5;
            height: fit-content;
        }

        .form-header { margin-bottom: 30px; }
        .form-header h2 { font-size: 24px; font-weight: 700; color: #2c3e50; margin-bottom: 6px; }
        .form-header p { font-size: 14px; color: #7f8c8d; }

        /* --- Form Elements --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .full-width { grid-column: span 2; }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #ced6d6;
            font-size: 14px;
            color: #2c3e50;
            background-color: #ffffff;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00796b;
            box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.05);
        }

        textarea { resize: vertical; min-height: 90px; }

        /* --- Simplified Upload Image Section --- */
        .upload-section {
            border: 1px solid #ced6d6;
            border-radius: 12px;
            padding: 20px;
            background-color: #fcfdfe;
        }

        /* Drag and Drop Zone */
        .dropzone {
            border: 2px dashed #b2dfdb;
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            background: #ffffff;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .dropzone:hover {
            background: rgba(0, 121, 107, 0.02);
            border-color: #00796b;
        }
        .dropzone i { font-size: 36px; color: #00796b; margin-bottom: 8px; display: block; }
        .dropzone span { font-size: 13px; color: #546e7a; font-weight: 500; }
        .dropzone strong { color: #00796b; text-decoration: underline; }

        /* Multi-Image Preview Layout */
        .preview-wrapper {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #eef2f5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .preview-status { font-size: 13px; color: #7f8c8d; font-weight: 500; }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 12px;
        }

        .img-preview-box {
            width: 100px;
            height: 100px;
            border: 1px solid #eef2f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #ffffff;
            position: relative;
        }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }

        .remove-img-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(211, 47, 47, 0.9);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remove-img-btn:hover { background: #b71c1c; }

        /* --- Actions --- */
        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .btn-cancel { background-color: #f4f7f6; border-color: #e0eae9; color: #546e7a; text-decoration: none; display: flex; align-items: center; }
        .btn-cancel:hover { background-color: #eaeaea; }
        .btn-submit { background-color: #00796b; color: #ffffff; }
        .btn-submit:hover { background-color: #004d40; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <a href="dashboard.html" class="menu-btn"><i class="ti ti-arrow-left"></i></a>
        <span class="brand-name">ToolMates</span>
    </div>
    <div class="nav-right">
        <a href="Profile.html" class="btn-nav btn-login">My Account</a>
    </div>
</header>

<div class="main-layout">

    <aside class="sidebar">
        <div class="sidebar-section-title">Navigate</div>
        <a href="dashboard.html" class="menu-item"><i class="ti ti-home"></i> Home</a>
        <a href="Browse Tools.html" class="menu-item"><i class="ti ti-tool"></i> Browse Tools</a>

        <div class="sidebar-section-title">Categories</div>
        <a href="#" class="menu-item"><i class="ti ti-hammer"></i> Repair & Build</a>
        <a href="#" class="menu-item"><i class="ti ti-camera"></i> Photography</a>
        <a href="#" class="menu-item"><i class="ti ti-device-laptop"></i> Technology</a>
        <a href="#" class="menu-item"><i class="ti ti-shovel"></i> Heavy Equipment</a>
    </aside>

    <main class="content-area">
        <div class="form-container">
            <div class="form-header">
                <h2>List a New Tool</h2>
                <p>Provide your tool specifics to submit your item listings directly onto the ecosystem grid.</p>
            </div>

            <form id="listToolForm" onsubmit="handleFormSubmit(event)">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="userName">User Name</label>
                        <input type="text" id="userName" required placeholder="e.g., Rahat Karim" />
                    </div>

                    <div class="form-group">
                        <label for="userId">Student ID / User ID</label>
                        <input type="text" id="userId" required placeholder="e.g., 2021-1-60-042" />
                    </div>

                    <div class="form-group">
                        <label for="toolName">Tool Name</label>
                        <input type="text" id="toolName" required placeholder="e.g., DeWalt Cordless Drill 20V" />
                    </div>

                    <div class="form-group">
                        <label for="toolCategory">Category</label>
                        <select id="toolCategory" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Repair & Build">Repair & Build</option>
                            <option value="Photography">Photography</option>
                            <option value="Technology">Technology</option>
                            <option value="Heavy Equipment">Heavy Equipment</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="toolCondition">Condition</label>
                        <select id="toolCondition" required>
                            <option value="" disabled selected>Select current state</option>
                            <option value="Brand New">Brand New</option>
                            <option value="Like New">Like New</option>
                            <option value="Good">Good</option>
                            <option value="Fair">Fair</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pricePerDay">Rent Rate (Tk / Day)</label>
                        <input type="number" id="pricePerDay" min="0" required placeholder="e.g., 500" />
                    </div>

                    <div class="form-group">
                        <label for="maxRentingPeriod">Max Renting Period (Days)</label>
                        <input type="number" id="maxRentingPeriod" min="1" required placeholder="e.g., 7" />
                    </div>

                    <div class="form-group">
                        <label for="pickupLocation">Pickup Point</label>
                        <input type="text" id="pickupLocation" required placeholder="e.g., Central Library Lobby" />
                    </div>

                    <div class="form-group full-width">
                        <label>Upload Images (Up to 3)</label>
                        <div class="upload-section">

                            <div class="dropzone" id="dropzoneContainer" onclick="document.getElementById('fileInput').click()">
                                <i class="ti ti-cloud-upload"></i>
                                <span>Drag & drop images here or <strong>browse your device</strong></span>
                                <input type="file" id="fileInput" style="display:none;" accept="image/*" multiple onchange="handleLocalFiles(this)" />
                            </div>

                            <div class="preview-wrapper">
                                <span class="preview-status" id="previewStatus">0 / 3 images uploaded</span>
                                <div class="preview-grid" id="previewGrid">
                                    <div class="img-preview-box"><i class="ti ti-photo" style="color: #ced6d6; font-size: 20px;"></i></div>
                                    <div class="img-preview-box"><i class="ti ti-photo" style="color: #ced6d6; font-size: 20px;"></i></div>
                                    <div class="img-preview-box"><i class="ti ti-photo" style="color: #ced6d6; font-size: 20px;"></i></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" required placeholder="Describe tool features, included components, accessories..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="additionalInfo">Additional Info / Rules (Optional)</label>
                        <textarea id="additionalInfo" placeholder="Return rules, pickup notes, or care instructions."></textarea>
                    </div>

                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn btn-cancel">Cancel</a>
                    <button type="submit" class="btn btn-submit">Submit Listing</button>
                </div>
            </form>
        </div>
    </main>

</div>

<script>
    let uploadedImages = [];
    function handleLocalFiles(input) {
        const files = Array.from(input.files);

        files.forEach(file => {
            if (uploadedImages.length >= 3) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (uploadedImages.length < 3) {
                    uploadedImages.push(e.target.result);
                    renderPreviews();
                }
            }
            reader.readAsDataURL(file);
        });
        input.value = ''; // Clear file input buffer
    }

    const dropzone = document.getElementById('dropzoneContainer');

    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.style.borderColor = '#00796b';
            dropzone.style.background = 'rgba(0, 121, 107, 0.02)';
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.style.borderColor = '#b2dfdb';
            dropzone.style.background = '#ffffff';
        }, false);
    });

    dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleLocalFiles({ files: files });
    }, false);

    function removeImage(index) {
        uploadedImages.splice(index, 1);
        renderPreviews();
    }

    function renderPreviews() {
        const grid = document.getElementById('previewGrid');
        const status = document.getElementById('previewStatus');
        grid.innerHTML = '';

        uploadedImages.forEach((src, idx) => {
            const box = document.createElement('div');
            box.className = 'img-preview-box';
            box.innerHTML = `
                <img src="${src}" alt="Preview ${idx + 1}" />
                <button type="button" class="remove-img-btn" onclick="removeImage(${idx})">&times;</button>
            `;
            grid.appendChild(box);
        });

        // Keep 3 slot visual grid uniformity unbroken via placeholders loops
        for (let i = uploadedImages.length; i < 3; i++) {
            const placeholder = document.createElement('div');
            placeholder.className = 'img-preview-box';
            placeholder.innerHTML = `<i class="ti ti-photo" style="color: #ced6d6; font-size: 20px;"></i>`;
            grid.appendChild(placeholder);
        }

        status.innerText = `${uploadedImages.length} / 3 images uploaded`;
        status.style.color = uploadedImages.length > 0 ? "#00796b" : "#7f8c8d";
    }

    async function handleFormSubmit(event) {
        event.preventDefault();

        if (uploadedImages.length === 0) {
            alert("Please upload at least one image of your tool.");
            return;
        }

        const toolData = {
            ownerName: document.getElementById('userName').value,
            ownerId: document.getElementById('userId').value,
            name: document.getElementById('toolName').value,
            category: document.getElementById('toolCategory').value,
            condition: document.getElementById('toolCondition').value,
            pricePerDay: parseFloat(document.getElementById('pricePerDay').value),
            maxRentingPeriod: parseInt(document.getElementById('maxRentingPeriod').value),
            pickupLocation: document.getElementById('pickupLocation').value,
            imageUrls: uploadedImages, // Sends base64 array payload direct to controller maps
            description: document.getElementById('description').value,
            additionalInfo: document.getElementById('additionalInfo').value
        };

        try {
            const response = await fetch('http://localhost:8080/api/tools/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(toolData)
            });

            if (response.ok) {
                alert('Success! Your tool has been listed with ' + uploadedImages.length + ' photo(s).');
                window.location.href = 'dashboard.html';
            } else {
                alert('Server returned error status code: ' + response.status);
            }
        } catch (error) {
            console.error('Backend pipeline connectivity failed:', error);
            alert('Could not reach backend API endpoint server.');
        }
    }
</script>
</body>
</html>
