server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.config.import=optional:file:.env[.properties]

# Database configurations
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toolmates_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# Native Spring Boot Mail Properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:63342,http://127.0.0.1:63342,http://localhost:8080,https://toolmates.onrender.com}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.scheduler.rental-deadline-delay-ms=30000
app.demo-mode=false
app.demo-minutes-per-day=1
app.demo-ending-reminder-seconds=30
app.demo-owner-return-check-seconds=60

server.jetty.max-http-post-size=20MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
